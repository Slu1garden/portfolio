<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Doki Doki — прототип</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Philosopher:wght@700&display=swap" rel="stylesheet">
<style>
:root{--r:#CA6666;--l:#F2F3F8;--b:#E2E5F0;--g:#7CBB5A;--t:#000;--m:#6b6b73}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#cfd4e4;font-family:Inter,system-ui,sans-serif;color:var(--t);display:flex;align-items:center;justify-content:center}
#f{width:393px;height:852px;border-radius:46px;background:var(--l);position:relative;overflow:hidden;box-shadow:0 20px 60px #0004,0 0 0 9px #111;flex:none}
@media(max-width:480px){body{background:var(--l)}#f{width:100vw;height:100dvh;border-radius:0;box-shadow:none;transform:none!important}}
.sb{position:absolute;top:27px;left:42px;z-index:5;pointer-events:none;color:#000}
.sc{position:absolute;inset:0;overflow:auto;padding-bottom:90px;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
.hd{background:var(--l);padding:50px 20px 12px;text-align:center;font-size:25px;font-weight:700;position:relative}
.zone{background:var(--b);padding:20px;min-height:100%}
.tabs{position:absolute;bottom:0;left:0;right:0;height:78px;background:var(--l);display:flex;justify-content:space-around;align-items:center;padding-bottom:8px;box-shadow:0 -2px 8px #0002;z-index:4}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;cursor:pointer;position:relative;min-width:56px}.tab.on{color:var(--r)}
.bd{position:absolute;top:-4px;right:6px;background:var(--r);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.btn{background:var(--r);color:#fff;border:0;border-radius:30px;height:59px;width:100%;font:600 21px Inter,system-ui,sans-serif;cursor:pointer}
.btn2{background:var(--l);color:#000;border:0;border-radius:30px;height:52px;width:100%;font:600 19px Inter,system-ui,sans-serif;cursor:pointer;margin-top:12px}
.btn:active,.btn2:active{transform:scale(.98)}
.card{background:var(--l);border-radius:26px;padding:14px 16px;margin-bottom:16px}
.rd{color:var(--r)}.mt{color:var(--m)}
.seg{background:var(--b);border-radius:26px;padding:11px 13px 11px;margin:0 11px}
.sw{background:var(--l);border-radius:22px;display:flex;height:42px}.sw div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:600;border-radius:22px;cursor:pointer;font-size:15px}.sw .on{background:var(--r);color:#fff}
.row{background:var(--l);border-radius:22px;height:42px;margin-top:9px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;cursor:pointer;font-size:15px}
.chips{display:flex;gap:10px;overflow:auto;padding:12px 11px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{background:var(--b);border-radius:20px;padding:0 16px;height:33px;display:flex;align-items:center;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}.chip.on{background:var(--r);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.it{background:var(--l);border-radius:24px;padding:12px;position:relative}
.it img,.ci img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;display:block}
.it .n{font-size:16px;margin-top:8px}.it .w{font-size:14px}.it .rt{font-size:13px;color:var(--r)}
.pr{display:flex;justify-content:space-between;align-items:center}.pr b{font-size:23px;color:var(--r)}
.pl{width:40px;height:40px;border-radius:50%;background:var(--r);color:#fff;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;position:relative}
.pl i{position:absolute;top:-6px;right:-4px;background:#fff;color:var(--r);font:700 11px Inter,system-ui,sans-serif;border-radius:9px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--r)}
.ci{display:flex;gap:14px;margin-bottom:22px}.ci img{width:112px;height:112px;flex:none}
.ci .c2{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.st{display:flex;align-items:center;border:1.5px solid var(--r);border-radius:20px;height:30px;gap:10px;padding:0 6px}.st span{cursor:pointer;display:flex}
.sum{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-size:20px}
.back{width:36px;height:36px;border-radius:50%;background:var(--r);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;position:absolute;left:20px;top:55px;z-index:3}
.pay{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #d8d9df;cursor:pointer;font-size:19px}
.rb{width:20px;height:20px;border-radius:50%;border:2px solid #aaa;flex:none}.rb.on{background:var(--r);border-color:var(--r);box-shadow:inset 0 0 0 3px var(--l)}
.kp{width:30px;height:30px;border-radius:8px;object-fit:cover}
.ok{width:100px;height:100px;border-radius:50%;background:var(--r);color:#fff;display:flex;align-items:center;justify-content:center;margin:70px auto 20px}
.map{position:relative;height:300px;margin-top:50px;border-radius:34px 34px 0 0;overflow:hidden;box-shadow:0 -3px 10px #0003}.map img{width:100%;height:100%;object-fit:cover}
.pin{position:absolute;left:58px;top:170px;width:54px;height:54px;border-radius:50%;background:#f0402e;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.pin small{font-size:10px}
.steps{display:flex;align-items:center;justify-content:center;margin:45px 0 24px}.sp{width:70px;height:70px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.4s}.sp.on{background:var(--r);color:#fff}.sp.dn{background:var(--g);color:#fff}
.cn{width:11px;height:5px;background:var(--r)}
.oc{background:var(--l);border-radius:24px;padding:14px;cursor:pointer}.oc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;margin-top:6px}
.tag{display:inline-block;border-radius:16px;padding:6px 18px;font-weight:700;font-size:15px;color:#fff;margin-bottom:8px}
.pf{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #cdd0dc}.pf small{display:block;font-size:13px}.pf div{font-size:20px}
.pf input{border:0;border-bottom:1.5px solid #555;background:transparent;font:20px Inter,system-ui,sans-serif;width:240px;padding:2px 0;outline:0}
.ml{display:flex;align-items:center;gap:22px;padding:18px 24px;border-bottom:1px solid #d8d9df;font-size:21px;cursor:pointer}.ml span{flex:1}
.logo{font:700 74px/.95 Philosopher,serif;text-align:center}
.o{display:inline-block;width:.62em;height:.62em;border-radius:50%;border:.09em solid #000;background:#e4e4e4;position:relative;vertical-align:-.02em;margin:0 .03em}.o::after{content:"";position:absolute;inset:.14em;border-radius:50%;background:var(--r)}
.ov{position:absolute;inset:0;background:#0007;backdrop-filter:blur(6px);z-index:9;display:flex;align-items:flex-end;padding:20px}
.toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);background:#222d;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:10;white-space:nowrap;animation:tf 2.2s forwards}
@keyframes tf{0%,80%{opacity:1}100%{opacity:0}}
.fade{animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;justify-content:center;gap:50px;text-align:center;font-size:17px;color:var(--m)}.ph div{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}.ph i{width:70px;height:70px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;color:#444}
