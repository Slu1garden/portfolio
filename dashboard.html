<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.cd{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:20px;animation:up .55s cubic-bezier(.2,.8,.2,1) backwards;transition:border-color .25s,transform .25s}.cd:hover{border-color:#2a3d33}.k .cd:hover{transform:translateY(-3px)}
.kl{color:var(--m);font-size:13px}.kv{font-size:30px;font-weight:700;margin:12px 0 10px;white-space:nowrap}.cd small{font-size:13px}.up,.g{color:var(--g)}.dn{color:var(--r)}
.hh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:8px}.hh b{font-size:15px}.hh span{color:var(--m);font-size:12px}.lh{display:inline-flex;gap:6px;align-items:center;margin-right:14px}.lh i{width:10px;height:10px;border-radius:3px}.nt{color:var(--m);font-size:13px;margin-top:14px}

.gl{position:absolute;left:0;right:0;border-top:1px solid var(--bd)}.gl b{position:absolute;left:-38px;top:-8px;width:30px;text-align:right;font:400 11px Inter,sans-serif;color:var(--m)}
.cs{position:absolute;inset:0;display:flex;align-items:flex-end}.cs>div{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.pl u{position:absolute;bottom:-24px;text-decoration:none;color:var(--m);font-size:12px;transform:translateX(-50%);white-space:nowrap}.cs u{left:50%}
.b{width:60%;max-width:56px;border-radius:7px 7px 2px 2px;transform-origin:bottom;animation:gr .9s cubic-bezier(.2,.8,.2,1) backwards;position:relative;transition:filter .2s}.b:hover{filter:brightness(1.3)}
.b em{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font:700 12px Inter,sans-serif;font-style:normal}
.stk{width:60%;max-width:44px;display:flex;flex-direction:column-reverse;transform-origin:bottom;animation:gr .9s cubic-bezier(.2,.8,.2,1) backwards}.stk .b{width:100%;max-width:none;animation:none;border-radius:0}.stk .b:last-child{border-radius:7px 7px 0 0}.stk .b:first-child{border-radius:0 0 2px 2px}
.grp{display:flex;align-items:flex-end;gap:4px;height:100%;width:76%;justify-content:center}.grp .b{width:50%;max-width:30px}
.pl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:rv 1.5s cubic-bezier(.3,.6,.3,1) backwards}

.pt{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;transition:transform .2s,background .2s;cursor:pointer}.pt.mk{background:var(--c);border:3px solid var(--col);animation:pp .5s backwards}.pt:hover{background:var(--col);transform:scale(1.3)}
.tg{position:absolute;left:6%;top:6%;border:1px solid var(--g3);background:#0f2a1b;color:var(--g);font:600 13px Inter,sans-serif;padding:8px 14px;border-radius:10px;animation:fi .6s 1.1s backwards}
.dn2{display:flex;flex-direction:column;align-items:center;gap:14px}.dn2.sd{flex-direction:row;gap:24px}.dw{position:relative;width:170px;flex:none}.sd .dw{width:150px}.dw svg{width:100%;display:block;stroke-width:11}.dw circle{transition:stroke-width .2s;animation:dd 1.2s cubic-bezier(.2,.8,.2,1) backwards}.dw circle:hover{stroke-width:14}
.ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}.ct b{font-size:30px}.ct small{color:var(--m);font-size:12px}
.lgs{width:100%}.lgd{display:flex;gap:10px;align-items:center;padding:6px 0}.lgd i{width:11px;height:11px;border-radius:3px;flex:none}.lgd span{flex:1}.lgd em{color:var(--m);font-style:normal}

.fr{margin-bottom:18px}.fr span{display:block;color:var(--m);margin-bottom:6px}.ft{position:relative;height:40px;background:#0c120f;border-radius:10px;overflow:hidden}.fb{height:100%;border-radius:10px;display:flex;align-items:center;padding-left:16px;animation:wd 1.1s cubic-bezier(.2,.8,.2,1) backwards}.fb b{font-size:15px}.ft em{position:absolute;right:14px;top:0;height:100%;display:flex;align-items:center;font:600 14px Inter,sans-serif;font-style:normal}
.big{font-size:52px;font-weight:700;margin:6px 0 2px}.rt small{color:var(--m)}.rt .hl{margin-top:14px}
.th,.tr{display:grid;grid-template-columns:2.2fr .8fr 2fr 1.2fr .8fr;gap:12px;align-items:center;padding:14px 6px}.th{color:var(--m);font-size:13px;border-bottom:1px solid var(--bd)}.th span{cursor:pointer;user-select:none;transition:color .2s}.th span:hover,.th .on{color:var(--g)}
.tr{border-bottom:1px solid var(--bd);border-radius:8px;animation:rw .5s cubic-bezier(.2,.8,.2,1) backwards;transition:background .2s}.tr:hover{background:#15211b}.tr:last-child{border:0}.th span:last-child,.tr>span:last-child{text-align:right}.rv{display:flex;align-items:center;gap:12px}.rv .tk{flex:1}.rv b{width:30px;text-align:right}.tr .g{font-weight:700}

</style></head><body>
<div id="app"><aside><div class="lg"><i><svg width="18" height="18" viewBox="0 0 24 24" stroke-width="2.4"><path d="M3 12h18M7 6v12M17 6v12"/></svg></i><div><b>IRON PULSE</b><small>панель владельца</small></div></div><nav id="nav"></nav><div class="us"><i>ДБ</i><div><b>Данил Б.</b><small>владелец</small></div></div></aside>
<main><header><div><h1 id="h1"></h1><p id="sub"></p></div><div style="display:flex;white-space:nowrap"><div class="dd"><button class="mb" id="mb"></button><div class="mn" id="mn"></div></div><button class="mb sq">₸</button></div></header><div id="main"></div></main></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s),nf=n=>Math.round(n).toLocaleString('ru-RU').replace(/[\u00a0\u202f]/g,' '),d1=n=>n.toFixed(1).replace('.',','),G='var(--g)',G2='var(--g2)',G3='var(--g3)',GY='var(--gy)';
const MON=[['Июль 2026',.91],['Август 2026',.96],['Сентябрь 2026',1]],M6=['Апр','Май','Июн','Июл','Авг','Сен'];
let mi=2,F=1,pg='fin',DI=0,KV=[],so=[-1,1];
const kpi=([l,n,f,s,c,m])=>{const fn=typeof f=='function';let v=f;if(fn){const x=m?n*F:n;KV.push({n:x,f});v=f(x)}return`<div class="cd" style="animation-delay:${DI++*60}ms"><span class="kl">${l}</span><div class="kv"${fn?` data-i="${KV.length-1}"`:''}>${v}</div><small class="${c}">${s}</small></div>`};
const kp=a=>`<div class="gr k">${a.map(kpi).join('')}</div>`,gr=x=>`<div class="gr">${x}</div>`,cd=(s,t,r,b)=>`<div class="cd s${s}" style="animation-delay:${DI++*60}ms"><div class="hh"><b>${t}</b><span>${r||''}</span></div>${b}</div>`,lg=a=>a.map(([n,c])=>`<span class="lh"><i style="background:${c}"></i>${n}</span>`).join('');
function bars(c){const Z=c.m?F:1,mx=c.t[c.t.length-1],S=c.s,u=c.u||'';return`<div class="bc" style="height:${c.h||250}px"><div class="pl">${c.t.map(t=>`<i class="gl" style="bottom:${t/mx*100}%"><b>${t}${u}</b></i>`).join('')}<div class="cs">${c.x.map((x,i)=>{const d=`animation-delay:${i*40}ms`;let b;
if(c.k=='stk'){const sm=S.reduce((a,s)=>a+s[i],0);b=`<div class="stk" style="height:${sm*Z/mx*100}%;${d}">${S.map((s,j)=>`<div class="b" data-t="${x} · ${c.n[j]}: ${nf(s[i]*Z)}" style="height:${s[i]/sm*100}%;background:${c.cl[j]}"></div>`).join('')}</div>`}
else if(c.k=='grp')b=`<div class="grp">${S.map((s,j)=>`<div class="b" data-t="${x} · ${c.n[j]}: ${d1(s[i]*Z)}" style="height:${s[i]*Z/mx*100}%;background:${c.cl[j]};${d}"></div>`).join('')}</div>`;
else{const v=S[0][i]*Z,h=c.hi&&c.hi.includes(i),tx=nf(v)+u;b=`<div class="b" data-t="${x}: ${tx}" style="height:${v/mx*100}%;background:${h?G:c.cl[0]};${d}">${c.vl=='all'||(c.vl&&c.vl.includes(i))?`<em>${tx}</em>`:''}</div>`}
return`<div>${b}<u>${x}</u></div>`}).join('')}</div></div></div>`}
function line(c){const n=c.d.length,mn=c.t[0],mx=c.t[c.t.length-1],X=i=>i/(n-1)*100,Y=v=>(1-(v-mn)/(mx-mn))*100,p=c.d.map((v,i)=>[X(i),Y(v)]),fc=c.fc==null?n-1:c.fc,col=c.col||G,id='g'+DI+n+Math.floor(Math.random()*999),f=c.f||d1,pa=p.slice(0,fc+1).map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(''),pf=p.slice(fc).map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join('');
return`<div class="bc" style="height:${c.h||250}px"><div class="pl">${c.t.map(t=>`<i class="gl" style="bottom:${(t-mn)/(mx-mn)*100}%"><b>${t}</b></i>`).join('')}<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path class="ar" d="${pa}L${p[fc][0]} 100L0 100Z" fill="url(#${id})"/>${fc<n-1?`<path class="fcl" d="${pf}" stroke="${col}"/>`:''}<path class="ln" d="${pa}" stroke="${col}"/></svg>${p.map((q,i)=>`<b class="pt${i==fc||i==n-1?' mk':''}" style="left:${q[0]}%;top:${q[1]}%;--col:${col};animation-delay:${900+i*50}ms" data-t="${c.x[i]}: ${f(c.d[i])}"></b>`).join('')}${c.x.map((x,i)=>`<u style="left:${X(i)}%">${x}</u>`).join('')}${c.tag?`<span class="tg">${c.tag}</span>`:''}</div></div>`}
function donut(c){const tot=c.d.reduce((a,b)=>a+b,0);let o=0;const sg=c.d.map((v,i)=>{const p=v/tot*100,w=Math.max(p-1.2,0),s=`<circle r="40" cx="50" cy="50" pathLength="100" stroke="${c.cl[i]}" stroke-dasharray="${w} ${100-w}" stroke-dashoffset="${-o}" style="animation-delay:${i*130}ms" data-t="${c.n[i]}: ${c.l[i]}"/>`;o+=p;return s}).join('');
return`<div class="dn2${c.side?' sd':''}"><div class="dw"><svg viewBox="0 0 100 100"><g transform="rotate(-90 50 50)">${sg}</g></svg><div class="ct"><b>${c.c}</b><small>${c.cs||''}</small></div></div><div class="lgs">${c.n.map((n,i)=>`<div class="lgd"><i style="background:${c.cl[i]}"></i><span>${n}</span><em>${c.l[i]}</em></div>`).join('')}</div></div>`}
const hl=c=>{const mx=c.mx||Math.max(...c.d);return`<div class="hl">${c.n.map((n,i)=>`<div class="hr" style="grid-template-columns:${c.w||'120px'} 1fr ${c.vw||'64px'}"><span>${n}</span><div class="tk"><div class="fl" data-t="${n}: ${c.v[i]}" style="width:${c.d[i]/mx*100}%;background:${c.cl?c.cl[i]:c.c};animation-delay:${i*90}ms"></div></div><b>${c.v[i]}</b></div>`).join('')}</div>`};
const fn=c=>c.n.map((n,i)=>`<div class="fr"><span>${n}</span><div class="ft"><div class="fb" data-t="${n}: ${c.d[i]}" style="width:${c.d[i]/c.d[0]*100}%;background:${c.cl[i]};color:${c.tc[i]};animation-delay:${i*160}ms"><b>${c.d[i]}</b></div><em>${c.p[i]}%</em></div></div>`).join('');
const TB=[['Месячный вечерний',148,3.4,28400,66],['Месячный дневной',96,1.9,19800,61],['Годовой 24/7',34,3.7,108800,82],['Месячный 24/7',71,2.2,31000,64],['Разовое посещение',212,.7,3300,null]];
function tbl(){const rows=[...TB];if(so[0]>=0)rows.sort((a,b)=>{const x=a[so[0]]??-1,y=b[so[0]]??-1;return(typeof x=='string'?x.localeCompare(y):x-y)*so[1]});
return`<div class="th">${['Абонемент','Продаж','Выручка, млн ₸','Средний чек','Продление'].map((h,i)=>`<span class="${so[0]==i?'on':''}" onclick="srt(${i})">${h}${so[0]==i?(so[1]>0?' ↑':' ↓'):''}</span>`).join('')}</div>${rows.map((r,i)=>`<div class="tr" style="animation-delay:${i*70}ms"><b>${r[0]}</b><span>${r[1]}</span><div class="rv"><div class="tk"><div class="fl" style="width:${r[2]/3.7*100}%;background:${r[2]==3.7?G:G3};animation-delay:${i*70+150}ms"></div></div><b>${d1(r[2])}</b></div><span>${nf(r[3])} ₸</span><span class="g">${r[4]?r[4]+'%':'—'}</span></div>`).join('')}`}
function srt(i){so=so[0]==i?(so[1]>0?[i,-1]:[-1,1]):[i,1];$('#tbl').innerHTML=tbl()}
const pc=v=>Math.round(v)+'%',mil=v=>d1(v)+' млн ₸',tg=(n,c)=>[n,c];
const PG={
fin:{t:'Финансы',s:'Выручка, расходы и прогноз',mo:1,r:()=>kp([['Средний чек',28400,v=>nf(v)+' ₸','▲ 4,2% · за клиента в месяц','up',1],['Повторные продажи',68,pc,'286 из 420 продлили абонемент','g'],['Упущенная выручка',1.9,mil,'▲ 12% · 64 клиента ушли','dn',1],['Чистая прибыль',4.6,mil,'▲ 8,1% · выручка 11,9 − расходы 7,3','up',1]])
+gr(cd(8,'Выручка и прогноз','млн ₸',line({d:[8.7,9.15,8.9,9.75,10.3,10.65,11.2,12.1,12.6],x:['Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт'],t:[8,9,10,11,12,13],fc:7,tag:'Прогноз на октябрь: 12,6 млн ₸',f:v=>d1(v)+' млн ₸'}))+cd(4,'Структура расходов','млн ₸',donut({d:[2.4,.9,3.2,.8],n:['Аренда','Коммуналка','Зарплата','Оборудование'],l:['2,4 млн ₸','0,9 млн ₸','3,2 млн ₸','0,8 млн ₸'],cl:[G,G2,G3,GY],c:'7,3',cs:'млн ₸ расходов'})))
+gr(cd(8,'Выручка и расходы',lg([['Выручка',G],['Расходы',GY]])+' <span style="margin-left:12px">млн ₸</span>',bars({k:'grp',m:1,x:M6,s:[[9.2,10.1,10.6,10.9,11.2,11.9],[6.6,6.9,7,7,7.2,7.3]],n:['Выручка','Расходы'],cl:[G,GY],t:[0,3.5,7,10.5,14]}))+cd(4,'Кто перестал ходить','млн ₸',hl({n:['Месячный вечерний','Месячный дневной','Годовой 24/7','Разовые'],d:[.8,.5,.3,.3],v:['0,8','0,5','0,3','0,3'],c:'var(--r)',w:'118px',vw:'30px'})+'<p class="nt">64 клиента не были 30+ дней: потеряно 1,9 млн ₸</p>'))},
