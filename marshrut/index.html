<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KazToGo</title>
<meta name="description" content="Переезд из России в Казахстан по шагам: сроки, блокнот, гид.">
<script>(function(){var q=location.search,h=document.documentElement,emb=/[?&]embed=1/.test(q),force=/[?&]app\b/.test(q),sa=false;
try{sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone}catch(e){}
var desk=!emb&&!force&&!sa&&matchMedia('(min-width:760px) and (hover:hover) and (pointer:fine)').matches;
if(emb)h.classList.add('emb');if(desk)h.classList.add('desk');window.__desk=desk;})();</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1115" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KazToGo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<link rel="icon" href="icons/icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Идея: спокойный справочник-помощник для человека в очереди в ЦОНе. Светлый и тёплый, цвет несёт смысл статуса. */
:root{
  --bg:#EEF1F5;--surface:#FBFCFD;--surface2:#E3E8EE;--line:#D5DBE3;
  --ink:#2C333D;--mut:#5D6877;
  --pri:#2A756D;--pri-soft:#DDEEEB;--on-pri:#FFFFFF;
  --ok:#1B8A4B;--ok-soft:#E1F4E8;
  --warn:#9A6700;--warn-soft:#FBF0D5;
  --bad:#C23B3B;--bad-soft:#FBE4E2;
  --r-card:24px;--r-ctl:16px;--r-sheet:32px;
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1115;--surface:#171B21;--surface2:#1F242B;--line:#2A3039;
  --ink:#EDF0F3;--mut:#9AA4B0;
  --pri:#6CC0B6;--pri-soft:#15302D;--on-pri:#06221F;
  --ok:#4BD08A;--ok-soft:#12301F;
  --warn:#E5B454;--warn-soft:#33290F;
  --bad:#FF8F85;--bad-soft:#3A1B19;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115;--surface:#171B21;--surface2:#1F242B;--line:#2A3039;
  --ink:#EDF0F3;--mut:#9AA4B0;
  --pri:#6CC0B6;--pri-soft:#15302D;--on-pri:#06221F;
  --ok:#4BD08A;--ok-soft:#12301F;
  --warn:#E5B454;--warn-soft:#33290F;
  --bad:#FF8F85;--bad-soft:#3A1B19;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 0 104px}
.mut{color:var(--mut)}.small{font-size:13px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}

/* шапка */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}

/* карточки и кнопки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin-bottom:12px}
.card h2{font-size:17px;font-weight:600;margin-bottom:4px;text-wrap:balance}
.lab{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--pri);color:var(--on-pri);font-weight:600;cursor:pointer}
.btn.block{display:flex;width:100%}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.tag{white-space:nowrap;flex:none;display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--mut);margin:0 6px 6px 0}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.pri{background:var(--pri-soft);color:var(--pri)}
.alert{border-radius:20px;padding:12px 16px;font-size:14px;line-height:1.45;margin-bottom:12px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.pri{background:var(--pri-soft);color:var(--pri)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row>h2{min-width:0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.big{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em}

/* поля */
label.q{display:block;font-weight:600;margin:20px 0 8px}
input[type=date],input[type=text],input[type=search],select,textarea{width:100%;min-height:50px;padding:10px 18px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:96px;border-radius:20px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* шаги маршрута */
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:10px;overflow:hidden}
.step.done{border-color:var(--ok)}
.step.locked{background:transparent;border:1px dashed var(--line)}
.step.locked .sh{opacity:.5;padding-top:10px;padding-bottom:10px}
.step.locked .dot{background:none;border-color:var(--line);color:var(--mut)}
.step.locked .st b{font-weight:500}
.sh{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer}
.dot{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;margin-top:1px}
.step.ready .dot{border-color:var(--pri);color:var(--pri)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.st{flex:1;min-width:0}
.st b{display:block;font-weight:600;line-height:1.3}
.st span{display:block;font-size:13px;color:var(--mut);margin-top:2px;line-height:1.4}
.chev{flex:none;width:20px;height:20px;color:var(--mut);margin-top:6px;transition:transform .2s}
.step.open .chev{transform:rotate(180deg)}
.sb{display:none;padding:0 16px 16px 60px;font-size:15px;line-height:1.55}
.step.open .sb{display:block}
.sb ul{margin:6px 0 12px;padding-left:18px}.sb li{margin-bottom:6px}
.sb .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* вкладки внизу */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 2px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:500;cursor:pointer;border-radius:999px}
.tab .pill{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--pri);font-weight:600}
.tab[aria-current="page"] .pill{background:var(--pri-soft)}

/* блокнот, справочник */
.seg{display:flex;padding:4px;gap:4px;border-radius:999px;background:var(--surface2);margin-bottom:14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:none;color:var(--mut);font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.note .acts{display:flex;gap:8px;margin-top:10px}
.art{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:10px;overflow:hidden}
.art summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.art summary::-webkit-details-marker{display:none}
.art summary b{font-weight:600}
.art .ab{padding:0 16px 16px;font-size:15px;line-height:1.55}
.art .ab ul{padding-left:18px;margin:6px 0 10px}.art .ab li{margin-bottom:6px}
.src{font-size:13px;color:var(--mut);margin-top:10px}
.src a{color:var(--mut)}
.log{border-left:2px solid var(--line);padding:0 0 18px 16px;margin-left:6px;position:relative}
.log::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.log.plan::before{background:var(--surface);border:2px solid var(--mut)}
dl{margin:0}dt{font-weight:600;margin-top:14px}dd{margin:2px 0 0;color:var(--mut)}

/* экран приветствия и шторка */
.hello h1{font-size:30px;line-height:1.12;margin:10px 0 12px;text-wrap:balance}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,14,18,.5);display:none}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet>div{max-width:520px;margin:0 auto}
.foot{font-size:12px;color:var(--mut);line-height:1.55;margin-top:20px}

:root{--brand:#5DA79F}
/* движение */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes popin{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes logoin{0%{opacity:0;transform:scale(.82)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes wmin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim>*{animation:rise .5s both cubic-bezier(.2,.7,.2,1)}
.anim>*:nth-child(2){animation-delay:.04s}.anim>*:nth-child(3){animation-delay:.08s}.anim>*:nth-child(4){animation-delay:.12s}
.anim>*:nth-child(5){animation-delay:.16s}.anim>*:nth-child(6){animation-delay:.2s}.anim>*:nth-child(7){animation-delay:.24s}
.anim>*:nth-child(8){animation-delay:.28s}.anim>*:nth-child(n+9){animation-delay:.32s}
.step.opening .sb{animation:rise .3s both cubic-bezier(.2,.7,.2,1)}
.dot.pop{animation:popin .4s both}
.note.fresh{animation:drop .4s both cubic-bezier(.2,.7,.2,1)}
.bar i{transition:width .9s cubic-bezier(.2,.7,.2,1)}
.btn,.chip,.icon-btn,.tab .pill,.step,.seg button{transition:transform .15s,background-color .2s,border-color .2s,color .2s}
.btn:active,.chip:active,.icon-btn:active{transform:scale(.96)}
.tab:active .pill{transform:scale(.92)}
.chev{transition:transform .25s}
.art .ab{animation:rise .3s both}
.sheet-bg{display:block;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .3s}
.sheet-bg.on{visibility:visible;opacity:1;transition:opacity .25s}
.sheet{transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.on .sheet{transform:none}
.hello>*{animation:rise .55s both cubic-bezier(.2,.7,.2,1)}
.hello>*:nth-child(2){animation-delay:.06s}.hello>*:nth-child(3){animation-delay:.12s}.hello>*:nth-child(4){animation-delay:.18s}
.hello>*:nth-child(5){animation-delay:.24s}.hello>*:nth-child(6){animation-delay:.3s}.hello>*:nth-child(7){animation-delay:.36s}.hello>*:nth-child(8){animation-delay:.42s}

.take{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.tk{display:flex;align-items:center;gap:12px;min-height:40px;cursor:pointer}
.tk input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--pri)}
.tk input:checked+span{color:var(--mut);text-decoration:line-through}
.maps{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.mp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mp span:first-child{min-width:0}
.mp .btn{text-decoration:none}
.bk textarea{min-height:90px;font-size:13px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
/* достижения */
.ach{display:flex;flex-direction:column;gap:8px}
.ac{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;border:1px dashed var(--line);color:var(--mut)}
.ac .ic{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line)}
.ac .ic svg{width:18px;height:18px}
.ac b{display:block;font-weight:600;line-height:1.3}
.ac span{font-size:13px}
.ac.got{border:1px solid var(--pri);background:var(--pri-soft);color:var(--ink)}
.ac.got .ic{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:55;max-width:calc(100% - 32px);padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;text-align:center;opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}
html.emb .toast{bottom:112px}
/* Эмиль */
.hero{margin:0 0 14px}
.say{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px 18px;margin-bottom:12px}
.say p{font-size:17px;font-weight:600;line-height:1.35;text-wrap:balance;margin-bottom:12px}
.say .tail{position:absolute;bottom:-9px;left:32px;width:16px;height:16px;margin-left:-8px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-right-radius:5px;transform:rotate(45deg);transition:left .9s cubic-bezier(.2,.7,.2,1)}
.trail{position:relative;height:96px}
.rail{position:absolute;left:32px;right:32px;bottom:12px;height:8px;border-radius:99px;background:var(--surface2)}
.rail .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:var(--pri);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.rail .stn{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.rail .stn.on{background:var(--pri);border-color:var(--pri)}
.rail .stn.end{width:20px;height:20px;margin:-10px 0 0 -10px}
.emil{position:absolute;left:32px;bottom:10px;width:76px;height:76px;margin-left:-38px;transition:left .9s cubic-bezier(.2,.7,.2,1)}
.emil .bob{width:100%;height:100%;animation:bob 3.4s ease-in-out infinite}
.emil.hop .bob{animation:hopE .7s cubic-bezier(.3,.7,.3,1)}
.emil svg{width:100%;height:100%;display:block;overflow:visible}
.emil .cl{fill:#f3f3f8;stroke:#111;stroke-width:5;stroke-linejoin:round}
.emil .cf{fill:#f3f3f8}
.emil .ink{fill:#111}
.emil .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.emil .tux{display:none}
.emil.fin .tux{display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hopE{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-4deg)}100%{transform:translateY(0)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
/* загрузочный экран */
#splash{position:fixed;inset:0;z-index:100;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(52vw,200px);height:auto;display:block;animation:logoin .8s both cubic-bezier(.2,.8,.2,1)}
#splash .wm{margin-top:4px;color:#fff;font-weight:600;font-size:20px;letter-spacing:.01em;animation:wmin .6s .5s both cubic-bezier(.2,.7,.2,1)}
html.desk #splash{display:none}

/* режим «в телефоне» (iframe) */
.sbar,.hbar{display:none}
html.emb .sbar{display:flex;position:fixed;top:0;left:0;right:0;height:46px;z-index:30;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:15px;color:var(--ink);background:var(--bg);pointer-events:none}
html.emb .sbar svg{height:12px;width:auto;display:block}
html.emb .sbar .ic{display:flex;gap:6px;align-items:center}
html.emb .hbar{display:block;position:fixed;left:50%;bottom:7px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.9;z-index:60;pointer-events:none}
html.emb .app{padding-top:58px}
html.emb .tabs{padding-bottom:22px}
html.emb .sheet{padding-bottom:34px}
html.emb ::-webkit-scrollbar{display:none}
html.emb{scrollbar-width:none}

/* сцена для компьютера */
#stage{display:none}
html.desk #stage{display:flex}
html.desk .app,html.desk .tabs,html.desk .sheet-bg{display:none !important}
html.desk body{padding:0;overflow:hidden}
#stage{position:fixed;inset:0;align-items:center;justify-content:center;gap:72px;background:
  radial-gradient(60% 60% at 70% 45%,var(--pri-soft),transparent 70%),var(--bg)}
#stage .info{max-width:300px}
#stage .info .lab{margin-bottom:10px}
#stage .info h2{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
#stage .info p{color:var(--mut);margin-bottom:18px}
#stage .info .btns{display:flex;flex-wrap:wrap;gap:8px}
#devwrap{flex:none;position:relative}
#dev{width:410px;height:864px;border-radius:58px;background:#2a2b31;padding:10px;position:relative;transform-origin:top left;
  box-shadow:0 40px 70px rgba(0,0,0,.35),0 0 0 2px #3a3c44 inset;animation:rise .7s both cubic-bezier(.2,.7,.2,1)}
#dev iframe{width:390px;height:844px;border:0;border-radius:48px;display:block;background:var(--bg)}
#dev .isl{position:absolute;top:21px;left:50%;width:112px;height:33px;margin-left:-56px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
@media (max-width:1000px){#stage .info{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

/* ===== Даты ===== */
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function addWork(d,n){var x=new Date(d);while(n>0){x.setDate(x.getDate()+1);var w=x.getDay();if(w!==0&&w!==6)n--}return x}
function diff(a,b){return Math.round((b-a)/86400000)}
function ru(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
function days(n){return n+' '+ru(n,'день','дня','дней')}
function calLink(title,d,details){var s=iso(d).replace(/-/g,''),e=iso(addDays(d,1)).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+s+'/'+e+'&details='+encodeURIComponent(details||'')}

/* ===== Логика маршрута ===== */
function arrived(){return diff(parseD(S.arr),today())>=0}
function activeSteps(){var a=arrived();return STEPS.filter(function(s){return !(s.cond==='phone'&&!S.phone)&&!(s.cond==='work'&&!S.work)&&!(s.id==='prep'&&a)})}
function isDone(id){return !!S.done[id]}
function blocked(s,list){return s.needs.filter(function(n){return list.some(function(x){return x.id===n})&&!isDone(n)})}
function stepTitle(id){var s=STEPS.filter(function(x){return x.id===id})[0];return s?s.title:''}
function notesFor(id){return S.notes.filter(function(n){return n.step===id})}

function render(){
  var anim=ANIM;ANIM=false;

  else nav.innerHTML=TABS.map(function(t){
    return '<button class="tab" type="button" data-tab="'+t.id+'"'+(t.id===TAB?' aria-current="page"':'')+'><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+t.svg+'</svg></span>'+t.label+'</button>'}).join('');

function viewRoute(){
  var list=activeSteps(),t=today(),arr=parseD(S.arr),dayN=diff(arr,t)+1,before=dayN<1,h='';
  var dl=addWork(arr,3);
  if(!isDone('notice')){
    var left=diff(t,dl);
    if(before)h+='<div class="alert warn">После прилёта попроси арендодателя подать уведомление. Срок: до <b>'+fmt(dl)+'</b>.</div>';
    else if(left<0)h+='<div class="alert bad">Срок уведомления (до '+fmt(dl)+') мог истечь. Свяжись с арендодателем или отелем сегодня. Праздничные дни не учтены.</div>';
    else h+='<div class="alert warn">Уведомление о пребывании: до <b>'+fmt(dl)+'</b>'+(left===0?' (сегодня)':', осталось '+days(left))+'. Праздничные дни не учтены.</div>';
  }
  if(!before&&dayN>=80&&dayN<=90)h+='<div class="alert warn">Осталось '+days(91-dayN)+' из 90. Если остаёшься, заранее узнай про РВП.</div>';
  if(dayN>90)h+='<div class="alert bad">Лимит 90 из 180 дней превышен. Обратись в миграционную службу, не откладывая.</div>';
  h+='<div class="card"><div class="row"><div><div class="lab" style="margin:0">Ты '+cityIn()+'</div><div class="big num">'+(before?'через '+days(1-dayN):'день '+dayN)+'</div></div><div style="text-align:right"><div class="lab" style="margin:0">Осталось без визы</div><div style="font-weight:600;font-size:18px" class="num">'+(before?'90 дней':Math.max(0,91-dayN)+' из 90')+'</div></div></div><p class="small mut" style="margin-top:10px">Правило: не больше 90 дней за любые 180 подряд. Выезд счётчик не обнуляет.</p></div>';
  var next=list.filter(function(s){return !isDone(s.id)&&!s.optional&&blocked(s,list).length===0})[0];
  h=heroHtml(list,next,POP!==null)+h;
  var done=list.filter(function(s){return isDone(s.id)}).length;
  h+='<div class="row" style="margin:20px 2px 10px"><h2 style="font-size:17px;font-weight:600">Все шаги</h2><span class="small mut num">'+done+' из '+list.length+'</span></div>';
  var hp='',hd='';
  list.forEach(function(s,i){
    var bl=blocked(s,list),d=isDone(s.id),st=d?'done':bl.length?'locked':'ready',open=OPEN_STEP===s.id;
    var tags=(s.verified?'<span class="tag ok">Источники, '+CHECKED+'</span>':'<span class="tag pri">Проверено автором лично</span>')+(s.changed?'<span class="tag bad">Правило изменилось '+s.changed+'</span>':'')+(s.optional?'<span class="tag pri">По необходимости</span>':'');
    var sub=bl.length?'Сначала: '+bl.map(function(n){return esc(stepTitle(n))}).join(', '):esc(s.sub);
    var nn=notesFor(s.id).length;
    var sh_='<div class="step '+st+(open?' open':'')+'" data-step="'+s.id+'"><button class="sh" type="button" data-act="toggle" data-id="'+s.id+'" aria-expanded="'+(open?'true':'false')+'"><div class="dot num'+(POP===s.id?' pop':'')+'">'+(d?'✓':(i+1))+'</div><div class="st"><b>'+esc(s.title)+'</b><span>'+sub+'</span></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="sb">'+tags+(typeof s.body==='function'?s.body():s.body)+takeHtml(s)+mapsHtml(s)
      +'<div class="acts"><button class="btn sm'+(d?' line':'')+'" type="button" data-act="mark" data-id="'+s.id+'"'+(bl.length&&!d?' disabled':'')+'>'+(d?'Отменить отметку':bl.length?'Сначала предыдущие шаги':'Отметить выполненным')+'</button>'
      +(s.ref?'<button class="btn sm sec" type="button" data-act="ref" data-id="'+s.ref+'">Подробнее</button>':'')
      +'<button class="btn sm sec" type="button" data-act="note" data-id="'+s.id+'">'+(nn?'Записи: '+nn+' · добавить':'Записать')+'</button></div></div></div>';
    if(d)hd+=sh_;else hp+=sh_;
  });
  h+=hp;
  if(hd)h+='<button class="btn line block" type="button" data-act="showdone" aria-expanded="'+SHOW_DONE+'" style="margin:6px 0 12px">'+(SHOW_DONE?'Скрыть пройденные':'Пройдено: '+done)+'</button>'+(SHOW_DONE?hd:'');
  h+=achHtml();
  return h;
}

  var end=addDays(arr,89),r80=addDays(arr,79);

   +'<p class="small mut" style="margin-top:12px">Последний день по этому въезду: <b>'+fmt(end)+'</b>. Выезд и въезд счётчик не обнуляют. Если уже бывал(а) в Казахстане, считай дни за последние 180.</p>'
   +'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><a class="btn sm sec" href="'+calLink('Через 10 дней кончается 90 дней без визы',r80,'Реши, остаёшься ли: нужен РВП. KazToGo')+'" target="_blank" rel="noopener">Напомнить за 10 дней</a><a class="btn sm sec" href="'+calLink('Последний день 90 дней без визы',end,'KazToGo')+'" target="_blank" rel="noopener">Последний день</a></div></div>';
  h+='<div class="row" style="margin:20px 2px 10px"><h2 style="font-size:17px;font-weight:600">Свои сроки</h2></div>';
  var cs=S.custom.slice().sort(function(a,b){return a.d<b.d?-1:1});
  if(!cs.length)h+='<p class="small mut" style="margin:0 2px 12px">Талон в ЦОН, запись в консульство, срок договора. Добавь дату, и она будет здесь.</p>';
  cs.forEach(function(c){var l=diff(t,parseD(c.d));h+='<div class="note"><div class="row"><div><b>'+esc(c.t)+'</b><div class="small mut num">'+fmt(parseD(c.d))+' · '+(l<0?'прошло '+days(-l):l===0?'сегодня':'через '+days(l))+'</div></div><button class="btn sm danger" type="button" data-act="delcustom" data-id="'+c.id+'">Удалить</button></div></div>'});
  h+='<div class="card"><label class="q" for="cT" style="margin-top:0">Что за срок?</label><input type="text" id="cT" placeholder="Например: талон в ЦОН" maxlength="80"><label class="q" for="cD">Дата</label><input type="date" id="cD" value="'+iso(addDays(t,1))+'"><button class="btn block" type="button" data-act="addcustom" style="margin-top:14px">Добавить срок</button></div>';
  h+='<p class="foot">Напоминания работают через твой календарь: ссылка откроет Google Календарь с готовым событием. Push-уведомления появятся в полноценном приложении.</p>';
  return h;
}

/* --- Блокнот --- */
function viewNotes(){
  var h='<div class="alert pri">Записи хранятся только в этом браузере. Не пиши сюда пароли и ключи ЭЦП.</div>';
  var edit=S.notes.filter(function(n){return n.id===EDIT_ID})[0];
  h+='<div class="card"><label class="q" for="nT" style="margin-top:0">'+(edit?'Изменить запись':'Новая запись')+'</label><textarea id="nT" placeholder="Что нужно запомнить?">'+esc(edit?edit.t:'')+'</textarea>'
   +'<button class="btn sm sec" type="button" data-act="tpltoggle" aria-expanded="false" style="margin-top:10px">Шаблоны</button><div class="chips" id="tplBox" hidden style="margin-top:10px">'+TEMPLATES.map(function(t,i){return '<button class="chip" type="button" data-act="tpl" data-i="'+i+'">'+esc(t.replace(/: $/,''))+'</button>'}).join('')+'</div>'
   +'<label class="q" for="nS" style="margin-top:6px">К какому шагу относится</label><select id="nS"><option value="">Без привязки</option>'+STEPS.map(function(s){return '<option value="'+s.id+'"'+((edit?edit.step:NOTE_STEP)===s.id?' selected':'')+'>'+esc(s.title)+'</option>'}).join('')+'</select>'
   +'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" type="button" data-act="savenote" style="flex:1">'+(edit?'Сохранить':'Добавить')+'</button>'+(edit?'<button class="btn line" type="button" data-act="cancelnote">Отмена</button>':'')+'</div></div>';
  if(S.notes.length){
    h+='<div style="display:flex;gap:8px;margin:18px 0 12px"><input type="search" id="nF" placeholder="Поиск по записям" value="'+esc(FILTER)+'" aria-label="Поиск по записям"></div>';
    var q=FILTER.trim().toLowerCase();
    var list=S.notes.filter(function(n){return !q||n.t.toLowerCase().indexOf(q)>-1||stepTitle(n.step).toLowerCase().indexOf(q)>-1});
    if(!list.length)h+='<p class="small mut">Ничего не найдено.</p>';
    list.forEach(function(n){
      h+='<div class="note'+(FRESH===n.id?' fresh':'')+'"><p>'+esc(n.t)+'</p><div class="meta">'+(n.step?'<span class="tag pri" style="margin:0">'+esc(stepTitle(n.step))+'</span>':'')+'<span class="small mut num">'+fmt(new Date(n.ts))+'</span></div><div class="acts"><button class="btn sm sec" type="button" data-act="editnote" data-id="'+n.id+'">Изменить</button><button class="btn sm '+(DEL_ARM===n.id?'danger':'line')+'" type="button" data-act="delnote" data-id="'+n.id+'">'+(DEL_ARM===n.id?'Точно удалить?':'Удалить')+'</button></div></div>';
    });
    h+='<div style="margin-top:14px"><button class="btn sm line" type="button" data-act="export">'+(SHOW_EXPORT?'Скрыть текст':'Показать всё текстом')+'</button></div>';
    if(SHOW_EXPORT){var txt=S.notes.map(function(n){return (n.step?'['+stepTitle(n.step)+'] ':'')+n.t+'  ('+fmt(new Date(n.ts))+')'}).join('\n\n');
      h+='<textarea id="exp" readonly style="margin-top:10px;min-height:160px">'+esc(txt)+'</textarea><button class="btn sm sec" type="button" data-act="copy" style="margin-top:8px">Скопировать</button>'}
  }else h+='<p class="small mut" style="margin:14px 2px">Пока пусто. Номера заявок, имена, адреса и вопросы лучше записывать сразу.</p>';
  return h;
}

/* --- Справочник --- */
function viewGuide(){
  var h='<div class="seg" role="group" aria-label="Раздел гида">'+[['rules','Правила'],['changes','Изменения'],['gloss','Словарь']].map(function(x){return '<button type="button" data-act="seg" data-id="'+x[0]+'" aria-pressed="'+(GUIDE_SEG===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(GUIDE_SEG==='rules'){
    h+='<p class="small mut" style="margin:0 2px 12px">Общие правила для граждан России. Дата проверки: '+CHECKED+'.</p>';
    ARTICLES.forEach(function(a){
      h+='<details class="art" id="art-'+a.id+'"'+(OPEN_ART===a.id?' open':'')+'><summary><b>'+esc(a.title)+'</b><span>'+(a.verified?'<span class="tag ok" style="margin:0">Проверено</span>':'<span class="tag pri" style="margin:0">Проверено лично</span>')+'</span></summary><div class="ab">'+(a.changed?'<div class="alert warn">Правило изменилось '+a.changed+'</div>':'')+a.body+srcLinks(a.src)+'</div></details>';
    });
  }else if(GUIDE_SEG==='changes'){
    h+='<p class="small mut" style="margin:0 2px 14px">Правила меняются быстро. Здесь то, что изменилось за последнее время.</p>';
    CHANGES.forEach(function(c){h+='<div class="log'+(c.plan?' plan':'')+'"><div class="small mut num">'+c.d+(c.plan?' · план':'')+'</div><b>'+esc(c.t)+'</b><p class="small" style="margin-top:2px">'+esc(c.x)+'</p>'+srcLinks(c.src)+'</div>'});
  }else{
    h+='<dl>'+GLOSS.map(function(g){return '<dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd>'}).join('')+'</dl>';
  }
  h+='<p class="foot">Проверено по открытым источникам '+CHECKED+'. «Проверено лично» значит, что автор прошёл этот шаг сам: такой информации нет в открытом доступе. Остальное сверено с источниками. Для официальных данных смотри egov.kz. Это учебный проект, а не юридическая консультация.</p>';
  return h;
}

/* --- Профиль --- */
function openSheet(){
  $('sheetIn').innerHTML='<div class="row" style="margin-bottom:6px"><h2 style="font-size:20px;font-weight:700">Профиль</h2><button class="icon-btn" type="button" data-act="closesheet" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
   +'<label class="q" for="pArr">Дата прилёта</label><input type="date" id="pArr" value="'+esc(S.arr)+'">'
   +'<label class="q">Везёшь телефон из России?</label><div class="chips" data-p="phone"><button class="chip" type="button" data-v="1" aria-pressed="'+(S.phone===true)+'">Да</button><button class="chip" type="button" data-v="0" aria-pressed="'+(S.phone===false)+'">Нет</button></div>'
   +'<label class="q">Зачем переезжаешь?</label><div class="chips" data-p="purpose">'+PURPOSES.map(function(x){return '<button class="chip" type="button" data-v="'+x[0]+'" aria-pressed="'+(S.purpose===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'
   +'<label class="q">Город</label><div class="chips" data-p="city">'+['almaty','astana','shymkent','other'].map(function(k){return '<button class="chip" type="button" data-v="'+k+'" aria-pressed="'+(S.city===k)+'">'+CITIES[k].n+'</button>'}).join('')+'</div><div id="cityBoxP" style="margin-top:10px"'+(S.city==='other'?'':' hidden')+'><input type="text" id="cityNameP" placeholder="Название города" maxlength="40" value="'+esc(S.cityName||'')+'" aria-label="Название города"></div>'
   +'<label class="q">Тема</label><div class="chips" data-p="theme">'+[['auto','Как в системе'],['light','Светлая'],['dark','Тёмная']].map(function(x){return '<button class="chip" type="button" data-v="'+x[0]+'" aria-pressed="'+(S.theme===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'
   +'<div style="margin-top:26px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-act="savesheet">Сохранить</button><button class="btn danger" type="button" data-act="reset">'+(RESET_ARM?'Точно стереть всё?':'Стереть все данные')+'</button></div>'
   +'<div class="bk"><div class="lab" style="margin-top:30px">Резервная копия</div><p class="small mut" style="margin-bottom:10px">Данные хранятся только на этом устройстве. Сохрани копию, чтобы перенести их или не потерять.</p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"><button class="btn sm sec" type="button" data-act="bkshow">Показать копию</button><button class="btn sm sec" type="button" data-act="bkcopy">Скопировать</button><button class="btn sm sec" type="button" data-act="bkdl">Скачать файл</button></div><textarea id="bkT" placeholder="Здесь появится копия. Чтобы восстановить, вставь сюда ранее сохранённую копию" aria-label="Резервная копия"></textarea><button class="btn sm line" type="button" data-act="bkrestore" style="margin-top:8px">Восстановить из копии</button><div class="msg" id="bkMsg" role="status"></div></div>'
   +'<p class="foot">KazToGo: учебный проект Данила Балашова. Данные хранятся только в твоём браузере.</p>';
  $('sheetBg').classList.add('on');
}
var RESET_ARM=false,sheetDraft=null;

/* ===== События ===== */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-act]');
  if(!t){if(e.target===$('sheetBg'))closeSheet();return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='profile'){sheetDraft={arr:S.arr,phone:S.phone,purpose:S.purpose,city:S.city,theme:S.theme};RESET_ARM=false;openSheet();return}
  if(a==='closesheet'){closeSheet();return}
  if(a==='toggle'){var el=t.closest('.step'),was=OPEN_STEP===id;document.querySelectorAll('.step.open').forEach(function(x){x.classList.remove('open','opening');x.querySelector('.sh').setAttribute('aria-expanded','false')});
    if(was)OPEN_STEP=null;else{el.classList.add('open','opening');t.setAttribute('aria-expanded','true');OPEN_STEP=id}return}
  if(a==='open'){OPEN_STEP=id;render();var el2=document.querySelector('[data-step="'+id+'"]');if(el2){el2.classList.add('opening');el2.scrollIntoView({behavior:'smooth',block:'center'})}return}
  if(a==='showdone'){SHOW_DONE=!SHOW_DONE;render();return}
  if(a==='mark'){if(S.done[id])delete S.done[id];else{S.done[id]=1;POP=id;if(OPEN_STEP===id)OPEN_STEP=null}save();checkAch(false);render();return}
  if(a==='ref'){GUIDE_SEG='rules';OPEN_ART=id;go('guide');return}
  if(a==='note'){NOTE_STEP=id;EDIT_ID=null;go('notes',true);return}
  if(a==='seg'){GUIDE_SEG=id;render();return}
  if(a==='tpltoggle'){var tb=$('tplBox');tb.hidden=!tb.hidden;t.setAttribute('aria-expanded',String(!tb.hidden));t.textContent=tb.hidden?'Шаблоны':'Скрыть шаблоны';return}
  if(a==='tpl'){var ta=$('nT');if(ta){ta.value=(ta.value&&!/\n$/.test(ta.value)?ta.value+'\n':ta.value)+TEMPLATES[+t.dataset.i];ta.focus()}return}
  if(a==='savenote'){var tx=$('nT').value.trim();if(!tx){$('nT').focus();return}var st=$('nS').value;
    if(EDIT_ID){S.notes.forEach(function(n){if(n.id===EDIT_ID){n.t=tx;n.step=st}});EDIT_ID=null}else{FRESH='n'+Date.now();S.notes.unshift({id:FRESH,t:tx,step:st,ts:Date.now()})}
    NOTE_STEP='';save();render();return}
  if(a==='cancelnote'){EDIT_ID=null;render();return}
  if(a==='editnote'){EDIT_ID=id;render();$('nT').focus();window.scrollTo(0,0);return}
  if(a==='delnote'){if(DEL_ARM===id){S.notes=S.notes.filter(function(n){return n.id!==id});DEL_ARM=null;save()}else{DEL_ARM=id;setTimeout(function(){if(DEL_ARM===id){DEL_ARM=null;if(TAB==='notes')render()}},3000)}render();return}
  if(a==='export'){SHOW_EXPORT=!SHOW_EXPORT;render();return}
  if(a==='copy'){var ex=$('exp');ex.select();try{navigator.clipboard.writeText(ex.value).catch(function(){document.execCommand&&document.execCommand('copy')})}catch(x){try{document.execCommand('copy')}catch(y){}}t.textContent='Скопировано';return}
  if(a==='addcustom'){var ct=$('cT').value.trim(),cd=$('cD').value;if(!ct||!cd){(ct?$('cD'):$('cT')).focus();return}S.custom.push({id:'c'+Date.now(),t:ct,d:cd});save();render();return}
  if(a==='delcustom'){S.custom=S.custom.filter(function(c){return c.id!==id});save();render();return}
  if(a==='savesheet'){var v=$('pArr').value;if(v)S.arr=v;if(sheetDraft.phone!==null&&sheetDraft.phone!==undefined)S.phone=sheetDraft.phone;S.purpose=sheetDraft.purpose;S.work=S.purpose==='work';S.city=sheetDraft.city;S.cityName=S.city==='other'?($('cityNameP').value.trim().slice(0,40)):'';S.theme=sheetDraft.theme;applyTheme();save();closeSheet();render();return}
  if(a==='bkshow'){$('bkT').value=JSON.stringify(S);$('bkMsg').className='msg';$('bkMsg').textContent='';return}
  if(a==='bkcopy'){var bt=$('bkT');if(!bt.value)bt.value=JSON.stringify(S);bt.select();var okc=false;try{navigator.clipboard.writeText(bt.value);okc=true}catch(x){try{okc=document.execCommand('copy')}catch(y){}}$('bkMsg').className='msg ok';$('bkMsg').textContent=okc?'Скопировано':'Выдели текст и скопируй вручную';return}
  if(a==='bkdl'){try{var bl=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(bl),an=document.createElement('a');an.href=u;an.download='kaztogo-backup-'+iso(today())+'.json';document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);$('bkMsg').className='msg ok';$('bkMsg').textContent='Файл сохранён'}catch(x){$('bkMsg').className='msg bad';$('bkMsg').textContent='Скачивание не сработало. Нажми «Показать копию» и скопируй текст'}return}
  if(a==='bkrestore'){var obj=null;try{obj=JSON.parse($('bkT').value)}catch(x){}
    if(!obj||typeof obj!=='object'||typeof obj.arr!=='string'||!obj.done||typeof obj.done!=='object'){$('bkMsg').className='msg bad';$('bkMsg').textContent='Не похоже на копию KazToGo. Проверь, что вставил(а) её целиком';return}
    S=obj;if(!S.notes)S.notes=[];if(!S.custom)S.custom=[];if(!S.theme)S.theme='auto';S=load2(S);applyTheme();save();closeSheet();ANIM=true;render();return}
  if(a==='reset'){if(RESET_ARM){try{localStorage.removeItem(KEY)}catch(x){}S={done:{},notes:[],custom:[],packed:{},city:'almaty',purpose:'other',theme:'auto'};applyTheme();closeSheet();pick={phone:null,purpose:null,city:null};RESET_ARM=false;render()}else{RESET_ARM=true;openSheet()}return}
});
document.addEventListener('click',function(e){
  var c=e.target.closest('.chips[data-p] .chip');if(!c)return;
  var box=c.parentNode,k=box.dataset.p,v=c.dataset.v;
  box.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed','false')});c.setAttribute('aria-pressed','true');
  sheetDraft[k]=k==='phone'?(v==='1'):v;if(k==='city'){$('cityBoxP').hidden=v!=='other'}
  if(k==='theme'){S.theme=v;applyTheme()}
});
document.addEventListener('input',function(e){if(e.target.id==='nF'){FILTER=e.target.value;var pos=e.target.selectionStart;render();var f=$('nF');if(f){f.focus();try{f.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('change',function(e){var k=e.target&&e.target.dataset&&e.target.dataset.take;if(!k)return;if(e.target.checked)S.packed[k]=1;else delete S.packed[k];save()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
function closeSheet(){$('sheetBg').classList.remove('on')}
function go(tab,focusNote){TAB=tab;ANIM=true;if(history.replaceState)try{history.replaceState(null,'','#'+tab)}catch(x){}render();window.scrollTo(0,0);if(focusNote){var n=$('nT');if(n)n.focus()}
  if(tab==='guide'&&OPEN_ART){var el=$('art-'+OPEN_ART);if(el){setTimeout(function(){el.scrollIntoView({block:'start'})},30)}}}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TITLES[h]&&h!==TAB){TAB=h;render()}});
(function(){var h=location.hash.slice(1);if(TITLES[h])TAB=h})();
if(S.arr)checkAch(true);
render();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
