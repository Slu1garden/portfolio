<style>
/* Идея: спокойный справочник-помощник для человека в очереди в ЦОНе. Светлый и тёплый, цвет несёт смысл статуса. */
:root{
  --bg:#F6F5F2;--surface:#FFFFFF;--surface2:#EFEDE8;--line:#E3E0D8;
  --ink:#14181F;--mut:#667085;
  --pri:#0E7C9B;--pri-soft:#DDF1F6;--on-pri:#FFFFFF;
  --ok:#1B8A4B;--ok-soft:#E1F4E8;
  --warn:#9A6700;--warn-soft:#FBF0D5;
  --bad:#C23B3B;--bad-soft:#FBE4E2;
  --r-card:16px;--r-ctl:12px;--r-sheet:24px;
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1115;--surface:#171B21;--surface2:#1F242B;--line:#2A3039;
  --ink:#EDF0F3;--mut:#9AA4B0;
  --pri:#43C2E2;--pri-soft:#12303A;--on-pri:#06222B;
  --ok:#4BD08A;--ok-soft:#12301F;
  --warn:#E5B454;--warn-soft:#33290F;
  --bad:#FF8F85;--bad-soft:#3A1B19;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115;--surface:#171B21;--surface2:#1F242B;--line:#2A3039;
  --ink:#EDF0F3;--mut:#9AA4B0;
  --pri:#43C2E2;--pri-soft:#12303A;--on-pri:#06222B;
  --ok:#4BD08A;--ok-soft:#12301F;
  --warn:#E5B454;--warn-soft:#33290F;
  --bad:#FF8F85;--bad-soft:#3A1B19;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 0 104px}
.mut{color:var(--mut)}.small{font-size:13px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}

/* шапка */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}

/* карточки и кнопки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin-bottom:12px}
.card h2{font-size:17px;font-weight:600;margin-bottom:4px;text-wrap:balance}
.lab{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r-ctl);border:0;background:var(--pri);color:var(--on-pri);font-weight:600;cursor:pointer}
.btn.block{display:flex;width:100%}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--mut);margin:0 6px 6px 0}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.pri{background:var(--pri-soft);color:var(--pri)}
.alert{border-radius:var(--r-ctl);padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:12px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.pri{background:var(--pri-soft);color:var(--pri)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.big{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em}

/* поля */
label.q{display:block;font-weight:600;margin:20px 0 8px}
input[type=date],input[type=text],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:96px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* шаги маршрута */
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:10px;overflow:hidden}
.step.done{border-color:var(--ok)}
.step.locked .sh{opacity:.6}
.sh{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer}
.dot{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;margin-top:1px}
.step.ready .dot{border-color:var(--pri);color:var(--pri)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.st{flex:1;min-width:0}
.st b{display:block;font-weight:600;line-height:1.3}
.st span{display:block;font-size:13px;color:var(--mut);margin-top:2px;line-height:1.4}
.chev{flex:none;width:20px;height:20px;color:var(--mut);margin-top:6px;transition:transform .2s}
.step.open .chev{transform:rotate(180deg)}
.sb{display:none;padding:0 16px 16px 60px;font-size:15px;line-height:1.55}
.step.open .sb{display:block}
.sb ul{margin:6px 0 12px;padding-left:18px}.sb li{margin-bottom:6px}
.sb .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* вкладки внизу */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 2px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:500;cursor:pointer;border-radius:var(--r-ctl)}
.tab .pill{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--pri);font-weight:600}
.tab[aria-current="page"] .pill{background:var(--pri-soft)}

/* блокнот, справочник */
.seg{display:flex;padding:4px;gap:4px;border-radius:var(--r-ctl);background:var(--surface2);margin-bottom:14px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;color:var(--mut);font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.note .acts{display:flex;gap:8px;margin-top:10px}
.art{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:10px;overflow:hidden}
.art summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.art summary::-webkit-details-marker{display:none}
.art summary b{font-weight:600}
.art .ab{padding:0 16px 16px;font-size:15px;line-height:1.55}
.art .ab ul{padding-left:18px;margin:6px 0 10px}.art .ab li{margin-bottom:6px}
.src{font-size:13px;color:var(--mut);margin-top:10px}
.src a{color:var(--mut)}
.log{border-left:2px solid var(--line);padding:0 0 18px 16px;margin-left:6px;position:relative}
.log::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.log.plan::before{background:var(--surface);border:2px solid var(--mut)}
dl{margin:0}dt{font-weight:600;margin-top:14px}dd{margin:2px 0 0;color:var(--mut)}

/* экран приветствия и шторка */
.hello h1{font-size:30px;line-height:1.12;margin:10px 0 12px;text-wrap:balance}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,14,18,.5);display:none}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet>div{max-width:520px;margin:0 auto}
.foot{font-size:12px;color:var(--mut);line-height:1.55;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

/* ===== Даты ===== */
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function addWork(d,n){var x=new Date(d);while(n>0){x.setDate(x.getDate()+1);var w=x.getDay();if(w!==0&&w!==6)n--}return x}
function diff(a,b){return Math.round((b-a)/86400000)}
function ru(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
function days(n){return n+' '+ru(n,'день','дня','дней')}
function calLink(title,d,details){var s=iso(d).replace(/-/g,''),e=iso(addDays(d,1)).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+s+'/'+e+'&details='+encodeURIComponent(details||'')}

/* ===== Логика маршрута ===== */
function arrived(){return diff(parseD(S.arr),today())>=0}
function activeSteps(){var a=arrived();return STEPS.filter(function(s){return !(s.cond==='phone'&&!S.phone)&&!(s.cond==='work'&&!S.work)&&!(s.id==='prep'&&a)})}
function isDone(id){return !!S.done[id]}
function blocked(s,list){return s.needs.filter(function(n){return list.some(function(x){return x.id===n})&&!isDone(n)})}
function stepTitle(id){var s=STEPS.filter(function(x){return x.id===id})[0];return s?s.title:''}
function notesFor(id){return S.notes.filter(function(n){return n.step===id})}

/* ===== Экраны ===== */
function render(){
  var app=$('app'),tabs=$('tabs');
  if(!S.arr){tabs.hidden=true;app.innerHTML=viewHello();bindHello();return}

    var cnt=(t.id==='notes'&&S.notes.length)?'':'' ;
    return '<button class="tab" type="button" data-tab="'+t.id+'"'+(t.id===TAB?' aria-current="page"':'')+'><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+t.svg+'</svg></span>'+t.label+'</button>'}).join('');
  var body='';
  if(TAB==='route')body=viewRoute();else if(TAB==='deadlines')body=viewDeadlines();else if(TAB==='notes')body=viewNotes();else body=viewGuide();

}

  +'<button class="btn block" id="go" type="button" style="margin-top:28px" disabled>Построить маршрут</button>'

}
function bindHello(){
  var go=$('go'),arr=$('arr');
  function check(){go.disabled=!(arr.value&&pick.phone!==null&&pick.work!==null)}
  arr.addEventListener('input',check);
  document.querySelectorAll('.chips').forEach(function(box){box.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;
    box.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');pick[box.dataset.q]=b.dataset.v==='1';check()})});
  go.addEventListener('click',function(){S.arr=arr.value;S.phone=pick.phone;S.work=pick.work;save();TAB='route';render();window.scrollTo(0,0)});
}

/* --- Маршрут --- */
function viewRoute(){
  var list=activeSteps(),t=today(),arr=parseD(S.arr),dayN=diff(arr,t)+1,before=dayN<1,h='';
  var dl=addWork(arr,3);
  if(!isDone('notice')){
    var left=diff(t,dl);
    if(before)h+='<div class="alert warn">После прилёта попроси арендодателя подать уведомление. Срок: до <b>'+fmt(dl)+'</b>.</div>';
    else if(left<0)h+='<div class="alert bad">Срок уведомления (до '+fmt(dl)+') мог истечь. Свяжись с арендодателем или отелем сегодня. Праздничные дни не учтены.</div>';
    else h+='<div class="alert warn">Уведомление о пребывании: до <b>'+fmt(dl)+'</b>'+(left===0?' (сегодня)':', осталось '+days(left))+'. Праздничные дни не учтены.</div>';
  }
  if(!before&&dayN>=80&&dayN<=90)h+='<div class="alert warn">Осталось '+days(91-dayN)+' из 90. Если остаёшься, заранее узнай про РВП.</div>';
  if(dayN>90)h+='<div class="alert bad">Лимит 90 из 180 дней превышен. Обратись в миграционную службу, не откладывая.</div>';
  h+='<div class="card"><div class="row"><div><div class="lab" style="margin:0">Ты в Казахстане</div><div class="big num">'+(before?'через '+days(1-dayN):'день '+dayN)+'</div></div><div style="text-align:right"><div class="lab" style="margin:0">Без визы</div><div style="font-weight:600;font-size:18px">90 из 180 дней</div></div></div><div class="bar"><i style="width:'+(before?0:Math.min(100,dayN/90*100))+'%"></i></div></div>';
  var next=list.filter(function(s){return !isDone(s.id)&&!s.optional&&blocked(s,list).length===0})[0];
  h+='<div class="card" style="border-color:var(--pri)">'+(next?'<div class="lab">Следующий шаг</div><h2>'+esc(next.title)+'</h2><p class="mut small" style="margin-bottom:12px">'+esc(next.sub)+'</p><button class="btn sm" type="button" data-act="open" data-id="'+next.id+'">Открыть шаг</button>':'<div class="lab">Готово</div><h2>Основные шаги пройдены</h2><p class="mut small">Дальше следи за сроком пребывания и узнай про РВП, если остаёшься дольше 90 дней.</p>')+'</div>';
  var done=list.filter(function(s){return isDone(s.id)}).length;
  h+='<div class="row" style="margin:20px 2px 10px"><h2 style="font-size:17px;font-weight:600">Все шаги</h2><span class="small mut num">'+done+' из '+list.length+'</span></div>';
  list.forEach(function(s,i){
    var bl=blocked(s,list),d=isDone(s.id),st=d?'done':bl.length?'locked':'ready',open=OPEN_STEP===s.id;
    var tags=(s.verified?'<span class="tag ok">Проверено '+CHECKED+'</span>':'<span class="tag">Из опыта автора</span>')+(s.changed?'<span class="tag bad">Правило изменилось '+s.changed+'</span>':'')+(s.optional?'<span class="tag pri">По необходимости</span>':'');
    var sub=bl.length?'Сначала: '+bl.map(function(n){return esc(stepTitle(n))}).join(', '):esc(s.sub);
    var nn=notesFor(s.id).length;
    h+='<div class="step '+st+(open?' open':'')+'" data-step="'+s.id+'"><button class="sh" type="button" data-act="toggle" data-id="'+s.id+'" aria-expanded="'+(open?'true':'false')+'"><div class="dot num">'+(d?'✓':(i+1))+'</div><div class="st"><b>'+esc(s.title)+'</b><span>'+sub+'</span></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="sb">'+tags+s.body
      +'<div class="acts"><button class="btn sm'+(d?' line':'')+'" type="button" data-act="mark" data-id="'+s.id+'"'+(bl.length&&!d?' disabled':'')+'>'+(d?'Отменить отметку':bl.length?'Сначала предыдущие шаги':'Отметить выполненным')+'</button>'
      +(s.ref?'<button class="btn sm sec" type="button" data-act="ref" data-id="'+s.ref+'">Подробнее</button>':'')
      +'<button class="btn sm sec" type="button" data-act="note" data-id="'+s.id+'">'+(nn?'Записи: '+nn+' · добавить':'Записать')+'</button></div></div></div>';
  });
  return h;
}

  h+='<div class="row" style="margin:20px 2px 10px"><h2 style="font-size:17px;font-weight:600">Свои сроки</h2></div>';
  var cs=S.custom.slice().sort(function(a,b){return a.d<b.d?-1:1});
  if(!cs.length)h+='<p class="small mut" style="margin:0 2px 12px">Талон в ЦОН, запись в консульство, срок договора. Добавь дату, и она будет здесь.</p>';
  cs.forEach(function(c){var l=diff(t,parseD(c.d));h+='<div class="note"><div class="row"><div><b>'+esc(c.t)+'</b><div class="small mut num">'+fmt(parseD(c.d))+' · '+(l<0?'прошло '+days(-l):l===0?'сегодня':'через '+days(l))+'</div></div><button class="btn sm danger" type="button" data-act="delcustom" data-id="'+c.id+'">Удалить</button></div></div>'});
  h+='<div class="card"><label class="q" for="cT" style="margin-top:0">Что за срок?</label><input type="text" id="cT" placeholder="Например: талон в ЦОН" maxlength="80"><label class="q" for="cD">Дата</label><input type="date" id="cD" value="'+iso(addDays(t,1))+'"><button class="btn block" type="button" data-act="addcustom" style="margin-top:14px">Добавить срок</button></div>';
  h+='<p class="foot">Напоминания работают через твой календарь: ссылка откроет Google Календарь с готовым событием. Push-уведомления появятся в полноценном приложении.</p>';
  return h;
}

  if(S.notes.length){
    h+='<div style="display:flex;gap:8px;margin:18px 0 12px"><input type="search" id="nF" placeholder="Поиск по записям" value="'+esc(FILTER)+'" aria-label="Поиск по записям"></div>';
    var q=FILTER.trim().toLowerCase();
    var list=S.notes.filter(function(n){return !q||n.t.toLowerCase().indexOf(q)>-1||stepTitle(n.step).toLowerCase().indexOf(q)>-1});
    if(!list.length)h+='<p class="small mut">Ничего не найдено.</p>';
    list.forEach(function(n){
      h+='<div class="note"><p>'+esc(n.t)+'</p><div class="meta">'+(n.step?'<span class="tag pri" style="margin:0">'+esc(stepTitle(n.step))+'</span>':'')+'<span class="small mut num">'+fmt(new Date(n.ts))+'</span></div><div class="acts"><button class="btn sm sec" type="button" data-act="editnote" data-id="'+n.id+'">Изменить</button><button class="btn sm '+(DEL_ARM===n.id?'danger':'line')+'" type="button" data-act="delnote" data-id="'+n.id+'">'+(DEL_ARM===n.id?'Точно удалить?':'Удалить')+'</button></div></div>';
    });
    h+='<div style="margin-top:14px"><button class="btn sm line" type="button" data-act="export">'+(SHOW_EXPORT?'Скрыть текст':'Показать всё текстом')+'</button></div>';
    if(SHOW_EXPORT){var txt=S.notes.map(function(n){return (n.step?'['+stepTitle(n.step)+'] ':'')+n.t+'  ('+fmt(new Date(n.ts))+')'}).join('\n\n');
      h+='<textarea id="exp" readonly style="margin-top:10px;min-height:160px">'+esc(txt)+'</textarea><button class="btn sm sec" type="button" data-act="copy" style="margin-top:8px">Скопировать</button>'}
  }else h+='<p class="small mut" style="margin:14px 2px">Пока пусто. Номера заявок, имена, адреса и вопросы лучше записывать сразу.</p>';
  return h;
}

/* --- Справочник --- */
function viewGuide(){
  var h='<div class="seg" role="group" aria-label="Раздел справочника">'+[['rules','Правила'],['changes','Что изменилось'],['gloss','Словарь']].map(function(x){return '<button type="button" data-act="seg" data-id="'+x[0]+'" aria-pressed="'+(GUIDE_SEG===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(GUIDE_SEG==='rules'){
    h+='<p class="small mut" style="margin:0 2px 12px">Общие правила для граждан России. Дата проверки: '+CHECKED+'.</p>';
    ARTICLES.forEach(function(a){
      h+='<details class="art" id="art-'+a.id+'"'+(OPEN_ART===a.id?' open':'')+'><summary><b>'+esc(a.title)+'</b><span>'+(a.verified?'<span class="tag ok" style="margin:0">Проверено</span>':'<span class="tag" style="margin:0">Из опыта автора</span>')+'</span></summary><div class="ab">'+(a.changed?'<div class="alert warn">Правило изменилось '+a.changed+'</div>':'')+a.body+srcLinks(a.src)+'</div></details>';
    });
  }else if(GUIDE_SEG==='changes'){
    h+='<p class="small mut" style="margin:0 2px 14px">Правила меняются быстро. Здесь то, что изменилось за последнее время.</p>';
    CHANGES.forEach(function(c){h+='<div class="log'+(c.plan?' plan':'')+'"><div class="small mut num">'+c.d+(c.plan?' · план':'')+'</div><b>'+esc(c.t)+'</b><p class="small" style="margin-top:2px">'+esc(c.x)+'</p>'+srcLinks(c.src)+'</div>'});
  }else{
    h+='<dl>'+GLOSS.map(function(g){return '<dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd>'}).join('')+'</dl>';
  }
  h+='<p class="foot">Проверено по открытым источникам '+CHECKED+'. «Из опыта автора» значит, что шаг не подтверждён официальным источником. Сверяйся с egov.kz и госорганами. Это учебный проект, а не юридическая консультация.</p>';
  return h;
}

/* --- Профиль --- */
function openSheet(){
  $('sheetIn').innerHTML='<div class="row" style="margin-bottom:6px"><h2 style="font-size:20px;font-weight:700">Профиль</h2><button class="icon-btn" type="button" data-act="closesheet" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
   +'<label class="q" for="pArr">Дата прилёта</label><input type="date" id="pArr" value="'+esc(S.arr)+'">'
   +'<label class="q">Везёшь телефон из России?</label><div class="chips" data-p="phone"><button class="chip" type="button" data-v="1" aria-pressed="'+(S.phone===true)+'">Да</button><button class="chip" type="button" data-v="0" aria-pressed="'+(S.phone===false)+'">Нет</button></div>'
   +'<label class="q">Планируешь работать?</label><div class="chips" data-p="work"><button class="chip" type="button" data-v="1" aria-pressed="'+(S.work===true)+'">Да, по найму</button><button class="chip" type="button" data-v="0" aria-pressed="'+(S.work===false)+'">Нет</button></div>'
   +'<label class="q">Тема</label><div class="chips" data-p="theme">'+[['auto','Как в системе'],['light','Светлая'],['dark','Тёмная']].map(function(x){return '<button class="chip" type="button" data-v="'+x[0]+'" aria-pressed="'+(S.theme===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'
   +'<div style="margin-top:26px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-act="savesheet">Сохранить</button><button class="btn danger" type="button" data-act="reset">'+(RESET_ARM?'Точно стереть всё?':'Стереть все данные')+'</button></div>'
   +'<p class="foot">Маршрут KZ: учебный проект Данила Балашова. Данные хранятся только в твоём браузере.</p>';
  $('sheetBg').classList.add('on');
}
var RESET_ARM=false,sheetDraft=null;

/* ===== События ===== */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-act]');
  if(!t){if(e.target===$('sheetBg'))closeSheet();return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='profile'){sheetDraft={arr:S.arr,phone:S.phone,work:S.work,theme:S.theme};RESET_ARM=false;openSheet();return}
  if(a==='closesheet'){closeSheet();return}
  if(a==='toggle'){OPEN_STEP=OPEN_STEP===id?null:id;render();return}
  if(a==='open'){OPEN_STEP=id;render();var el=document.querySelector('[data-step="'+id+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(a==='mark'){if(S.done[id])delete S.done[id];else S.done[id]=1;save();render();return}
  if(a==='ref'){GUIDE_SEG='rules';OPEN_ART=id;go('guide');return}
  if(a==='note'){NOTE_STEP=id;EDIT_ID=null;go('notes',true);return}
  if(a==='seg'){GUIDE_SEG=id;render();return}
  if(a==='tpl'){var ta=$('nT');if(ta){ta.value=(ta.value&&!/\n$/.test(ta.value)?ta.value+'\n':ta.value)+TEMPLATES[+t.dataset.i];ta.focus()}return}
  if(a==='savenote'){var tx=$('nT').value.trim();if(!tx){$('nT').focus();return}var st=$('nS').value;
    if(EDIT_ID){S.notes.forEach(function(n){if(n.id===EDIT_ID){n.t=tx;n.step=st}});EDIT_ID=null}else S.notes.unshift({id:'n'+Date.now(),t:tx,step:st,ts:Date.now()});
    NOTE_STEP='';save();render();return}
  if(a==='cancelnote'){EDIT_ID=null;render();return}
  if(a==='editnote'){EDIT_ID=id;render();$('nT').focus();window.scrollTo(0,0);return}
  if(a==='delnote'){if(DEL_ARM===id){S.notes=S.notes.filter(function(n){return n.id!==id});DEL_ARM=null;save()}else{DEL_ARM=id;setTimeout(function(){if(DEL_ARM===id){DEL_ARM=null;if(TAB==='notes')render()}},3000)}render();return}
  if(a==='export'){SHOW_EXPORT=!SHOW_EXPORT;render();return}
  if(a==='copy'){var ex=$('exp');ex.select();try{navigator.clipboard.writeText(ex.value).catch(function(){document.execCommand&&document.execCommand('copy')})}catch(x){try{document.execCommand('copy')}catch(y){}}t.textContent='Скопировано';return}
  if(a==='addcustom'){var ct=$('cT').value.trim(),cd=$('cD').value;if(!ct||!cd){(ct?$('cD'):$('cT')).focus();return}S.custom.push({id:'c'+Date.now(),t:ct,d:cd});save();render();return}
  if(a==='delcustom'){S.custom=S.custom.filter(function(c){return c.id!==id});save();render();return}
  if(a==='savesheet'){var v=$('pArr').value;if(v)S.arr=v;if(sheetDraft.phone!==null&&sheetDraft.phone!==undefined)S.phone=sheetDraft.phone;if(sheetDraft.work!==null&&sheetDraft.work!==undefined)S.work=sheetDraft.work;S.theme=sheetDraft.theme;applyTheme();save();closeSheet();render();return}
  if(a==='reset'){if(RESET_ARM){try{localStorage.removeItem(KEY)}catch(x){}S={done:{},notes:[],custom:[],theme:'auto'};applyTheme();closeSheet();pick={phone:null,work:null};RESET_ARM=false;render()}else{RESET_ARM=true;openSheet()}return}
});
document.addEventListener('click',function(e){
  var c=e.target.closest('.chips[data-p] .chip');if(!c)return;
  var box=c.parentNode,k=box.dataset.p,v=c.dataset.v;
  box.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed','false')});c.setAttribute('aria-pressed','true');
  sheetDraft[k]=k==='theme'?v:(v==='1');
  if(k==='theme'){S.theme=v;applyTheme()}
});
document.addEventListener('input',function(e){if(e.target.id==='nF'){FILTER=e.target.value;var pos=e.target.selectionStart;render();var f=$('nF');if(f){f.focus();try{f.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
function closeSheet(){$('sheetBg').classList.remove('on')}
function go(tab,focusNote){TAB=tab;if(history.replaceState)try{history.replaceState(null,'','#'+tab)}catch(x){}render();window.scrollTo(0,0);if(focusNote){var n=$('nT');if(n)n.focus()}
  if(tab==='guide'&&OPEN_ART){var el=$('art-'+OPEN_ART);if(el){setTimeout(function(){el.scrollIntoView({block:'start'})},30)}}}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TITLES[h]&&h!==TAB){TAB=h;render()}});
(function(){var h=location.hash.slice(1);if(TITLES[h])TAB=h})();
render();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
