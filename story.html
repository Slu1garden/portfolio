svg.layer{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
#world path{fill:none;stroke:#f2f3f5;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

#emil{position:absolute;left:0;top:0;z-index:3;pointer-events:none;will-change:transform}
#emil svg{width:100%;height:100%;display:block;overflow:visible}
#emil .cl{fill:#f3f3f8;stroke:#111;stroke-width:5;stroke-linejoin:round}

#emil .tear{fill:#6ab7ff;stroke:#111;stroke-width:1.6}

  {photo:5,say:["2026 год. Он улетает из России в двадцать один год, один, под страхом смерти, бросая всё, что у него есть.","Родители давят историями от знакомых, которые остались инвалидами на всю жизнь из-за беспредела военкоматов."]},
  {fly:true,say:["Больше всего он переживал за семью, особенно за младшего братика.","Он так хочет стать для них подспорьем, опорой. Он больше никогда не хочет терять тех, кого можно спасти."]},

    snd.bp=bp;ok=true;synth=src;
    // настоящий ветер из файла wind.mp3 (если он лежит рядом); иначе остаётся синтезированный
    try{fetch('wind.mp3').then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(ab){return new Promise(function(res,rej){ctx.decodeAudioData(ab,res,rej)})}).then(function(fb){
      var fs=ctx.createBufferSource();fs.buffer=fb;fs.loop=true;
      var l2=ctx.createBiquadFilter();l2.type='lowpass';l2.frequency.value=7000;
      fs.connect(l2);l2.connect(windG);fs.start();
      try{synth.stop()}catch(e){}snd.bp=null;fileWind=true;
    }).catch(function(){})}catch(e){}
  }
  function resume(){init();if(ctx&&ctx.state==='suspended')ctx.resume()}
  ['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,resume,{passive:true})});
  document.addEventListener('visibilitychange',function(){if(!ctx)return;if(document.hidden)ctx.suspend();else if(ctx.state==='suspended')ctx.resume()});
  function env(g,t,peak,att,dec){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec)}
  return {
    start:function(){resume()},
    isOn:function(){return on},
    set:function(v){on=v;try{localStorage.setItem('story_snd',v?'on':'off')}catch(e){}if(master)master.gain.setTargetAtTime(v?1:0,ctx.currentTime,.1);if(v)resume()},
    wind:function(level){if(!ok)return;windG.gain.setTargetAtTime(level*(fileWind?SND.windFile:SND.wind),ctx.currentTime,.4);if(snd.bp)snd.bp.frequency.setTargetAtTime(380+level*620,ctx.currentTime,.6)},
    blip:function(){if(!ok||!on)return;var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=380+Math.random()*240;o.connect(g);g.connect(master);env(g,t,SND.voice,.006,.07);o.start(t);o.stop(t+.12)},
    tick:function(){if(!ok||!on)return;var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=900+Math.random()*300;o.connect(g);g.connect(master);env(g,t,SND.voice*.6,.003,.035);o.start(t);o.stop(t+.06)},
    click:function(vol){if(!ok||!on)return;var t=ctx.currentTime;for(var k=0;k<2;k++){var s=ctx.createBufferSource(),g=ctx.createGain(),hp=ctx.createBiquadFilter();s.buffer=noiseBuf;hp.type='highpass';hp.frequency.value=1800;s.connect(hp);hp.connect(g);g.connect(master);env(g,t+k*.07,SND.click*(vol||1)*3,.002,.025);s.start(t+k*.07,Math.random()*2);s.stop(t+k*.07+.06)}},
    whoosh:function(){if(!ok||!on)return;var t=ctx.currentTime,s=ctx.createBufferSource(),g=ctx.createGain(),bp=ctx.createBiquadFilter();s.buffer=noiseBuf;bp.type='bandpass';bp.Q.value=3;bp.frequency.setValueAtTime(3600,t);bp.frequency.exponentialRampToValueAtTime(500,t+1.3);s.connect(bp);bp.connect(g);g.connect(master);env(g,t,SND.whoosh*3,.25,1.1);s.start(t,Math.random()*2);s.stop(t+1.6)},
    fadeOut:function(sec){if(master)master.gain.setTargetAtTime(0,ctx.currentTime,sec/3)}
  };
})();
function charSound(i,full){var c=full.charAt(i-1);if(c&&c!==' '&&i%2===0)snd.blip()}
var sndBtn=document.getElementById('snd');
function sndLabel(){sndBtn.textContent='звук: '+(snd.isOn()?'вкл':'выкл');sndBtn.setAttribute('aria-pressed',snd.isOn()?'true':'false')}
sndBtn.addEventListener('click',function(e){e.stopPropagation();snd.set(!snd.isOn());sndLabel()});sndLabel();

/* ---------- план пути ---------- */
function chars(t){return t.length}
function sayMs(arr){var m=0;arr.forEach(function(t){m+=t.length*26+Math.max(1500,t.length*35)});return m}
function plan(){
  mob=innerWidth<761;
  G.speed=mob?78:95;G.h=mob?34:44;G.run=mob?54:70;G.alpha=Math.atan(G.h/G.run);
  var d=0,dS=null,lastFly=-1;
  SCENES.forEach(function(s,i){
    s.d0=d;
    if(s.fly){
      var T=Math.max((s.min||15)*1000,sayMs(s.say));
      s.T=T;s.dist=G.speed*T/1000;
      if(s.stairs&&dS===null)dS=d;
      d+=s.dist;lastFly=i;
    }
    s.d1=d;
    if(s.photo!=null)G.stops[s.photo]=d;
  });
  G.dS=dS===null?d:dS;
  var Ts=d-G.dS;
  G.n=Math.max(1,Math.round(Ts*Math.sin(G.alpha)/G.h));
  G.Ts=G.n*G.h/Math.sin(G.alpha);
  G.dP=G.dS+G.Ts;
  SCENES[lastFly].d1=G.dP;SCENES[lastFly].dist=G.dP-SCENES[lastFly].d0;
  G.xP=G.dS+G.Ts*Math.cos(G.alpha);
  G.yP=-G.n*G.h;
  G.dBench=G.dP+(mob?300:460);
}
function pos(d){
  var a=G.alpha,h=G.h;
  if(d<=G.dS)return {x:d,y:0};
  if(d<=G.dP){var t=d-G.dS,off=h*.55*Math.min(1,t/140);return {x:G.dS+t*Math.cos(a),y:-t*Math.sin(a)-off}}
  var base=-G.Ts*Math.sin(a)-h*.55,k=Math.max(0,1-(d-G.dP)/140);
  return {x:G.xP+(d-G.dP),y:G.yP+(base-G.yP)*k};
}
/* ---------- геометрия мира ---------- */
function build(){
  var h=G.h,w=G.run,xS=G.dS,d='M'+(-W*4)+' 0 H'+xS;
  for(var i=0;i<G.n;i++){d+=' V'+(-(i+1)*h)+' H'+(xS+(i+1)*w)}
  floor.setAttribute('d',d);
  fd.setAttribute('d','M'+(-W*4)+' 16 H'+xS);
  var xt=xS+G.n*w;
  plat.setAttribute('d','M'+xt+' '+G.yP+' H'+(xt+W*3));
  var bx=G.xP+(G.dBench-G.dP),by=G.yP,b='';
  b+='<path class="bn" d="M'+(bx-96)+' '+(by-40)+' H'+(bx+96)+'"/>';
  b+='<path class="bn" d="M'+(bx-84)+' '+(by-40)+' V'+by+' M'+(bx+84)+' '+(by-40)+' V'+by+'"/>';
  b+='<path class="bn" d="M'+(bx-96)+' '+(by-40)+' V'+(by-96)+' H'+(bx-90)+'"/>';
  bench.innerHTML=b;
  G.bx=bx;
}
function buildPhotos(){
  PHOTOS.forEach(function(p,i){
    var f=document.createElement('figure');f.className='ph';
    var pic=document.createElement('div');pic.className='pic';pic.textContent='ФОТО '+(i+1);
    if(p.src){var im=new Image();im.alt='';im.onload=function(){pic.textContent='';pic.appendChild(im)};im.src=p.src}
    f.appendChild(pic);photosEl.appendChild(f);phEls.push(f);phO.push(0);phW.push(100);P.push({x:0,y:0});
  });
}
var FP=.72; /* параллакс фото: двигаются медленнее пола */
function layout(){
  W=innerWidth;H=innerHeight;mob=W<761;
  S=mob?Math.min(92,W*.24):Math.min(118,W*.095);
  ax=W*(mob?.30:.36);ay=H*(mob?.58:.60);
  PHOTOS.forEach(function(p,i){
    var pw=Math.max(90,W*p.w*(mob?2.5:1));phW[i]=pw;phEls[i].style.width=pw+'px';
    var d=G.stops[i],e=pos(d),camx=e.x-ax,camy=e.y-ay,onSt=d>G.dS+1;
    var py=onSt?(mob?p.ys*.92:p.ys):p.y,px=onSt?p.xs:p.x;
    P[i]={x:px*W+camx*FP,y:py*H+camy*FP};
  });
}
function makeDots(){
  for(var i=0;i<46;i++){
    var el=document.createElement('div'),f=[.18,.32,.5][i%3],sz=f>.4?2.4:f>.25?1.8:1.3;
    el.className='dot';el.style.width=el.style.height=sz+'px';
    dotsEl.appendChild(el);dots.push({el:el,f:f,x:Math.random(),y:Math.random(),o:.12+Math.random()*.25+f*.2});
    el.style.opacity=dots[i].o;
  }
}
/* ---------- кадр ---------- */
function hov(){return sitting?0:10+Math.sin((performance.now()-t0)/420)*3}
function frame(){
  var now=performance.now(),e=pos(cur),movingV=Math.abs(cur-lastCur);lastCur=cur;
  var sy=sit*40,camx=e.x-ax,camy=e.y-sy-ay;
  wg.setAttribute('transform','translate('+(-camx)+','+(-camy)+')');
  // Эмиль на экране (с развалочкой)
  var vel=Math.min(1,movingV*60/ (G.speed*1.2));sway+=(vel-sway)*.08;
  var rot=Math.sin(now/520)*3.2*sway;
  var bx0=ax-S/2,by0=ay-S*.88-hov();
  emilEl.style.width=emilEl.style.height=S+'px';
  emilEl.style.transform='translate3d('+bx0+'px,'+by0+'px,0) rotate('+rot+'deg)';
  var ho={x:bx0+S*.86,y:by0+S*.64};
  // свет
  var ta,tl,ts,to;
  if(aim!==null){var c=photoCenter(aim),dx=c.x-ho.x,dy=c.y-ho.y,dist=Math.hypot(dx,dy);ta=Math.atan2(dy,dx);tl=dist*1.12;ts=Math.max(.13,Math.atan((c.h/2+14)/dist));to=1}
  else if(sky){ta=-1.05;tl=S*6.5;ts=.16;to=.95}
  else{ta=cur>=G.dS?-G.alpha-.02:.12;tl=S*3.2;ts=.2;to=(started&&!sitting)?.5:0}
  cone_a+=(ta-cone_a)*.07;cone_len+=(tl-cone_len)*.07;cone_spread+=(ts-cone_spread)*.07;cone_op+=(to-cone_op)*.06;
  torch.setAttribute('transform','translate('+ho.x+','+ho.y+') rotate('+(cone_a*180/Math.PI)+')');
  var a1=cone_a-cone_spread,a2=cone_a+cone_spread,L=cone_len;
  var x1=ho.x+Math.cos(a1)*L,y1=ho.y+Math.sin(a1)*L,x2=ho.x+Math.cos(a2)*L,y2=ho.y+Math.sin(a2)*L;
  var ox=ho.x+Math.cos(cone_a)*22,oy=ho.y+Math.sin(cone_a)*22;
  cone.setAttribute('points',ox+','+oy+' '+x1+','+y1+' '+x2+','+y2);
  cg.setAttribute('x1',ox);cg.setAttribute('y1',oy);cg.setAttribute('x2',ox+Math.cos(cone_a)*L);cg.setAttribute('y2',oy+Math.sin(cone_a)*L);
  cone.setAttribute('opacity',Math.min(1,cone_op));
  // фото
  var t=(now-t0)/1000;
  for(var i=0;i<phEls.length;i++){
    var sx=P[i].x-camx*FP,sy2=P[i].y-camy*FP,pw=phW[i];
    phEls[i].style.transform='translate3d('+(sx-pw/2)+'px,'+(sy2-pw*.62)+'px,0) rotate('+PHOTOS[i].r+'deg)';
    var base=.03+.11*Math.pow(Math.max(0,Math.sin(t*.55+i*2.1)),6);
    var target=(lit===i)?1:(started?base:0);
    phO[i]+=(target-phO[i])*(lit===i?.05:.04);
    phEls[i].style.opacity=phO[i].toFixed(3);
  }
  // пыль/звёзды с параллаксом
  for(var k=0;k<dots.length;k++){
    var dd=dots[k],px=((dd.x*(W+40)-camx*dd.f)%(W+40)+(W+40))%(W+40)-20,py=((dd.y*(H+40)-camy*dd.f)%(H+40)+(H+40))%(H+40)-20;
    dd.el.style.transform='translate3d('+px+'px,'+py+'px,0)';
  }
  // реплика: под полом / под лестницей, рядом с Эмилем
  if(bub.classList.contains('on')||bub.textContent){
    var bw=bub.offsetWidth,bx=Math.max(14,Math.min(W-bw-14,ax-(mob?26:40)));
    bub.style.transform='translate3d('+bx+'px,'+(ay+34+sy)+'px,0)';
  }
  // ветер: сильнее в полёте и выше по лестнице, тише на скамейке
  var wt=now/1000,hgt=Math.max(0,Math.min(1,-e.y/Math.max(1,-G.yP)));
  var lvl=started?(.5+.22*Math.sin(wt*.43)+.14*Math.sin(wt*1.1+1.3)+.35*sway+.35*hgt)*(sitting?.55:1):0;
  snd.wind(lvl);
  requestAnimationFrame(frame);
}
var lastCur=0;
function photoCenter(i){var el=phEls[i],r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,h:r.height}}
/* ---------- поведение ---------- */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms/TS)})}
function waitRead(ms){return new Promise(function(res){var to=setTimeout(done,ms);function done(){clearTimeout(to);skipReq=null;res()}skipReq=done})}
function say(text,keep){
  return new Promise(function(res){
    bub.textContent='';bub.classList.add('on');emilEl.classList.add('talk');
    var i=0,full=text,step=reduce?0:26,iv;
    function finishTyping(){clearInterval(iv);bub.textContent=full;emilEl.classList.remove('talk');typing=null;
      waitRead(Math.max(1500,full.length*35)).then(function(){if(!keep){bub.classList.remove('on');setTimeout(function(){if(!bub.classList.contains('on'))bub.textContent=''},400)}res()})}
    typing=finishTyping;
    if(!step){finishTyping();return}
    iv=setInterval(function(){i++;bub.textContent=full.slice(0,i);charSound(i,full);if(i>=full.length)finishTyping()},step);
  });
}
async function sayAll(arr,keepLast){for(var i=0;i<arr.length;i++)await say(arr[i],keepLast&&i===arr.length-1)}
function moveTo(dEnd,ms){
  return new Promise(function(res){
    var from=cur,dur=reduce?1:ms/TS,st=performance.now();
    if(from===dEnd){res();return}
    (function step(){
      var k=Math.min(1,(performance.now()-st)/dur);
      var e=ease(k);
      cur=from+(dEnd-from)*e;
      if(k<1)requestAnimationFrame(step);else{cur=dEnd;res()}
    })();
  });
}
/* разгон и торможение по краям, между ними ровная «развалочка» */
function ease(k){
  var a=.1,v=1/(1-a);
  if(k<a)return v*k*k/(2*a);
  if(k>1-a){var r=1-k;return 1-v*r*r/(2*a)}
  return v*(a/2+(k-a));
}
stage.addEventListener('click',function(e){
  if(e.target.closest('#nm'))return;
  if(typing)typing();else if(skipReq)skipReq();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){leave('index.html');return}
  var tg=document.activeElement&&document.activeElement.tagName;
  if(tg==='INPUT'||tg==='BUTTON')return;
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();if(typing)typing();else if(skipReq)skipReq()}
});
function leave(url,white){snd.fadeOut(white?1.8:1);if(white)fade.classList.add('white');fade.classList.add('on');setTimeout(function(){location.href=url},reduce?50:(white?1900:1150))}
$('exit').addEventListener('click',function(){leave('index.html')});
function askName(){
  return new Promise(function(res){
    nm.classList.add('on');var b=nm.querySelector('button');nmi.value='';b.disabled=true;setTimeout(function(){nmi.focus()},300);
    nmi.oninput=function(){b.disabled=!nmi.value.trim();snd.tick()};
    nm.onsubmit=function(e){e.preventDefault();var v=nmi.value.trim();if(!v)return;nm.classList.remove('on');nmi.blur();res(v)};
  });
}
/* ---------- звезда и финальное окно ---------- */
function shootingStar(){
  snd.whoosh();
  var el=document.createElement('div'),i=document.createElement('i');el.className='star';
  var ang=Math.atan2(230,-420)*180/Math.PI;i.style.transform='rotate('+ang+'deg)';el.appendChild(i);
  var sx=W*(mob?.86:.78),sy=H*.1;el.style.left=sx+'px';el.style.top=sy+'px';
  stage.appendChild(el);
  var k=mob?.7:1,a=el.animate([{transform:'translate(0,0)',opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.7},{transform:'translate('+(-420*k)+'px,'+(230*k)+'px)',opacity:0}],{duration:reduce?300:1500,easing:'cubic-bezier(.5,0,.9,.6)'});
  a.onfinish=function(){el.remove()};
}
function finalDialog(parts){
  return new Promise(async function(res){
    bub.classList.remove('on');
    for(var k=0;k<parts.length;k++){
      var text=parts[k],last=k===parts.length-1;
      fint.textContent='';fin.classList.add('on');
      await new Promise(function(done){
        emilEl.classList.add('talk');
        var i=0,iv=setInterval(function(){
          i++;fint.textContent=text.slice(0,i);charSound(i,text);
          if(i>=text.length){clearInterval(iv);typing=null;emilEl.classList.remove('talk');done()}
        },reduce?1:34);
        typing=function(){clearInterval(iv);fint.textContent=text;typing=null;emilEl.classList.remove('talk');done()};
      });
      await waitRead(Math.max(last?3500:2000,text.length*45));
      if(!last){fin.classList.remove('on');await sleep(700)}
    }
    res();
  });
}
/* ---------- сценарий ---------- */
async function run(){
  plan();buildPhotos();layout();build();makeDots();
  addEventListener('resize',function(){layout();build()});
  requestAnimationFrame(frame);
  await sleep(500);stage.classList.add('on');
  await sleep(1200);
  started=true;snd.start();
  for(var i=0;i<SCENES.length;i++){
    var s=SCENES[i];
    if(s.fly){
      var mv=moveTo(s.d1,s.T);
      await sayAll(s.say);
      await mv;
    }else if(s.photo!=null){
      aim=s.photo;lit=s.photo;snd.click();await sleep(reduce?50:1100);
      await sayAll(s.say);
      aim=null;lit=-1;snd.click(.6);await sleep(500);
    }else{
      await sayAll(s.say);
    }
  }
  // платформа и скамейка
  var walk=G.dBench-G.dP;
  await moveTo(G.dBench,reduce?1:walk/G.speed*1000+800);
  await sleep(500);
  sitting=true;
  await (function(){return new Promise(function(r){var st=performance.now();(function f(){var k=Math.min(1,(performance.now()-st)/900);sit=k*k*(3-2*k);if(k<1)requestAnimationFrame(f);else r()})()})})();
  await sleep(900);
  await say(FINALE.a);
  bub.classList.remove('on');
  sky=true;await sleep(reduce?200:2200);shootingStar();await sleep(reduce?100:FINALE.pause-2200);sky=false;
  await say(FINALE.ask,true);
  var name=await askName();
  await finalDialog(FINALE.bye(name));
  try{localStorage.setItem('story_done','1')}catch(e){}
  leave('index.html',true);
}
run();
})();
